name: Build and Push Ros Jazzy Simulation Containers

on:
  schedule:
    - cron: '0 5 * * 0' # Every Sunday at 5 AM UTC
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------
  # STANDARD SIMULATION PIPELINE (MULTI-ARCH)
  # ---------------------------------------------------------
  build-sim-amd64:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push-amd64.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push AMD64 image (temporary tag)
        id: push-amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ros/jazzy/simulation/Dockerfile
          platforms: linux/amd64
          push: true
          tags: wisniax/ros-rover-base:temp-sim-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-sim-arm64:
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.push-arm64.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ARM64 image (temporary tag)
        id: push-arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ros/jazzy/simulation/Dockerfile
          platforms: linux/arm64
          push: true
          tags: wisniax/ros-rover-base:temp-sim-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-sim-manifest:
    runs-on: ubuntu-latest
    needs: [build-sim-amd64, build-sim-arm64]
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata for combined manifest
        id: meta_combined
        uses: docker/metadata-action@v5
        with:
          images: wisniax/ros-rover-base
          tags: |
            type=raw,value=simulation-latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=simulation-{{date 'YYYY-MM-DD'}},enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=branch,prefix=simulation-,enable=${{ github.ref != 'refs/heads/master' }}
          labels: |
            org.opencontainers.image.created={{date 'YYYY-MM-DDTHH:mm:ssZ'}}
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Create and push multi-arch manifest
        uses: int128/docker-manifest-create-action@v2
        with:
          tags: ${{ steps.meta_combined.outputs.tags }}
          sources: |
            wisniax/ros-rover-base@${{ needs.build-sim-amd64.outputs.digest }}
            wisniax/ros-rover-base@${{ needs.build-sim-arm64.outputs.digest }}
          index-annotations: ${{ steps.meta_combined.outputs.labels }}

  # ---------------------------------------------------------
  # ROCM SIMULATION PIPELINE (AMD64 ONLY)
  # ---------------------------------------------------------
  build-sim-rocm-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata for ROCm image
        id: meta_rocm
        uses: docker/metadata-action@v5
        with:
          images: wisniax/ros-rover-base
          tags: |
            type=raw,value=simulation-rocm-latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=simulation-rocm-{{date 'YYYY-MM-DD'}},enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=branch,prefix=simulation-rocm-,enable=${{ github.ref != 'refs/heads/master' }}
          labels: |
            org.opencontainers.image.created={{date 'YYYY-MM-DDTHH:mm:ssZ'}}
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push ROCm AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ros/jazzy/simulation-rocm/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_rocm.outputs.tags }}
          labels: ${{ steps.meta_rocm.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max